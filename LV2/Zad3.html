<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treći Zadatak</title>
    <style>
        
        body {
            display: flex;
            min-height: 100vh; 
            flex-direction: column; 
            margin: 0;
            font-family: Arial, sans-serif;
        }

       
        section {
            display: flex; 
            flex-grow: 1; 
        }
        
      
        main {
            width: 65%; 
            padding: 15px;
            background-color: #ffffff; 
        }
        
       
        aside {
            width: 30%;
            padding: 15px;
            background-color: #e9ecef; 
        }

      
        footer {
            margin-top: auto; 
            padding: 10px;
            background-color: #ccc;
            text-align: center;
        }

        header {
            background-color: lightblue; 
            padding: 10px;
        }
    </style>
</head>
<body>
    <header>Naslov</header>

    <section>
        <main>
            <h2>Neki člana (65% Sadržaja)</h2>
            <p>Lorem Ipsum.....</p>
            <br>
            <h2>Neki člana</h2>
            <p>Lorem Ipsum...</p>
        </main>

        <aside>Menu (30%)</aside>
    </section>
    
    <footer>Dolje</footer>
</body>
</html>
